name: PIA Flight Watch

on:
  schedule:
    # 5 runs/day, spaced ~5 hours apart, in UTC. Adjust to taste - just
    # keep it at 5 or fewer entries/day to respect the AirLabs quota.
    - cron: "0 0 * * *"   # 00:00 UTC
    - cron: "0 5 * * *"   # 05:00 UTC
    - cron: "0 10 * * *"  # 10:00 UTC
    - cron: "0 15 * * *"  # 15:00 UTC
    - cron: "0 20 * * *"  # 20:00 UTC
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state DB back

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run flight watch poll
        env:
          AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 pia_flight_watch.py

      - name: Commit updated state DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flight_state.db
          git diff --cached --quiet || git commit -m "Update flight state DB [skip ci]"
          git push
